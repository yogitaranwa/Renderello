<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renderello &middot; sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>
<main class="login-shell">
  <section class="panel-form">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6d6df8"/><stop offset=".55" stop-color="#9d5cf6"/><stop offset="1" stop-color="#d945ef"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bm)"/>
      <circle cx="16" cy="16" r="7.2" fill="none" stroke="#fff" stroke-width="2.4"/>
      <circle cx="16" cy="16" r="2.2" fill="#fff"/>
      <path d="M16 5.5v3M16 23.5v3M5.5 16h3M23.5 16h3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1>Renderello <em>Studio</em></h1>
    <p class="muted">AI product photography studio &middot; private</p>
    <p id="notice" class="notice" role="status" hidden></p>
    <form id="login-form" autocomplete="off" novalidate>
      <div id="fields"></div>
      <p id="err" class="err" role="alert"></p>
      <button id="go" type="submit"><span class="btn-label">Sign in</span></button>
    </form>
  </section>
  <aside class="panel-visual">
    <div class="visual-art" aria-hidden="true">
      <span class="ring ring-1"></span>
      <span class="ring ring-2"></span>
      <span class="ring ring-3"></span>
      <svg class="visual-mark" viewBox="0 0 32 32">
        <rect x="2" y="2" width="28" height="28" rx="8" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
        <circle cx="16" cy="16" r="7.2" fill="none" stroke="#fff" stroke-width="2.2"/>
        <circle cx="16" cy="16" r="2.2" fill="#fff"/>
        <path d="M16 5.5v3M16 23.5v3M5.5 16h3M23.5 16h3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="visual-tag">Product photoshoot variations,<br>built around your own photos.</p>
    <ul class="visual-points">
      <li>Scene, light and mood from your instructions</li>
      <li>Side-by-side variants for your review</li>
      <li>Private workspace - sign-in required</li>
    </ul>
  </aside>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
